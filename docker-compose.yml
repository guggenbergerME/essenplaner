services:
  essenplaner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: essenplaner
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - DEV_MODE=false
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
